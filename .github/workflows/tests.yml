name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for Qt, VTK and gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libglu1-mesa \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcursor1 libxft2 \
            libxinerama1 libxrender1 libxi6 libxrandr2
      - run: pip install -r requirements.txt pytest
      - name: Tests (OpenFOAM is not needed)
        run: xvfb-run -a python -m pytest -q
